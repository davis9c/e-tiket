services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
    ports:
      - "${APP_PORT:?APP_PORT must be set in .env}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
